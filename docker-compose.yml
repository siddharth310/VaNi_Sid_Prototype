services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vhos
      POSTGRES_PASSWORD: vhos
      POSTGRES_DB: vhos
    ports:
      - '5432:5432'
    volumes:
      - vhos_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @vhos/shared build && pnpm --filter @vhos/api exec prisma generate && pnpm --filter @vhos/api exec prisma migrate deploy && pnpm --filter @vhos/api dev"
    ports:
      - '3002:3001'
    env_file:
      - .env
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://vhos:vhos@postgres:5432/vhos
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      AGENT_CREATE_WEBHOOK_URL: http://host.docker.internal:8100/v1/agents/create
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @vhos/web dev --host 0.0.0.0"
    ports:
      - '5173:5173'
    env_file:
      - .env
    environment:
      CI: 'true'
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules

volumes:
  vhos_pgdata:
